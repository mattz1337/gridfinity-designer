<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<rect width="1200" height="360" rx="18" fill="#f0f5f7"/>
<g font-family="Arial,sans-serif" fill="#163b49">
<text x="32" y="42" font-size="24" font-weight="bold">One item. Three access designs.</text>
<g transform="translate(30 66)">
<rect width="350" height="265" rx="12" fill="white"/>
<text x="22" y="33" font-size="16" fill="#557685">R3 / SIDE OPENINGS</text>
<path d="M30 82V181H315V82M30 100H135V142H200V100H315" fill="none" stroke="#258779" stroke-width="9"/>
<text x="22" y="222" font-size="18">Easy access, unwanted cutouts</text>
<text x="22" y="246" font-size="14" fill="#557685">Outer-wall preference surfaced late.</text>
</g>
<g transform="translate(425 66)">
<rect width="350" height="265" rx="12" fill="white"/>
<text x="22" y="33" font-size="16" fill="#557685">R4 / CLOSED SIDES</text>
<path d="M30 82V181H315V82M30 100H315" fill="none" stroke="#258779" stroke-width="9"/>
<rect x="58" y="120" width="226" height="25" rx="9" fill="#93b9b3"/>
<text x="22" y="222" font-size="18">Clean walls, difficult grip</text>
<text x="22" y="246" font-size="14" fill="#557685">A fitted pocket also needs removal space.</text>
</g>
<g transform="translate(820 66)">
<rect width="350" height="265" rx="12" fill="white"/>
<text x="22" y="33" font-size="16" fill="#557685">R5 / PRESS TO LIFT</text>
<path d="M30 82V181H315V82" fill="none" stroke="#258779" stroke-width="9"/>
<path d="M132 178V142Q146 124 160 142V178" fill="#e6ab51"/>
<path d="M55 159L283 77" stroke="#e6ab51" stroke-width="24" stroke-linecap="round"/>
<text x="22" y="222" font-size="18">Press rear; cap rises</text>
<text x="22" y="246" font-size="14" fill="#557685">CAD checked. Physical prototype untested.</text>
</g>
</g>
</svg>
